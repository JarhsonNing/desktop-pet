[package]
name = "desktop-pet-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "On-demand Tauri control panel for Mochi"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop-pet = { path = "../.." }
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["sync", "time"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }

[[bin]]
name = "desktop-pet-panel"
path = "src/main.rs"
