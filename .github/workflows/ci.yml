name: Native builds and tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Run pending macOS migration checks too'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # macOS verification is opt-in while its panel migration is pending.
        include: ${{ fromJSON(inputs.include_macos && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm --prefix panel ci
      - run: npm --prefix panel run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -- --simulate
      - run: cargo build --locked --release --workspace --target ${{ matrix.target }}
      - name: Prepare CI-only Windows software renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa archive checksum mismatch' }
          7z x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $binaryDirectory = 'target/${{ matrix.target }}/release'
          Get-ChildItem "$destination/x64" -Filter '*.dll' -File | Copy-Item -Destination $binaryDirectory
          if (!(Test-Path "$binaryDirectory/opengl32.dll")) { throw 'Mesa OpenGL driver missing' }
          'GALLIUM_DRIVER=llvmpipe' >> $env:GITHUB_ENV
      - name: Native GUI smoke test
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/desktop-pet
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="$binary.exe"; fi
          python scripts/ci_smoke.py --binary "$binary" --output .artifacts/smoke
      - run: python scripts/package.py --target ${{ matrix.target }}
      - name: Tauri native page and lifecycle checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --locked --release --target ${{ matrix.target }} --example seed_panel_demo -- .artifacts/tauri-demo
          if ($LASTEXITCODE -ne 0) { throw 'Isolated UI fixture preparation failed' }
          $env:MOCHI_TEST_BINARY = 'target/${{ matrix.target }}/release/desktop-pet.exe'
          node panel/tests/native.mjs .artifacts/tauri-demo
          if ($LASTEXITCODE -ne 0) { throw 'Native Tauri UI checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GUI-smoke-${{ matrix.target }}
          path: |
            .artifacts/smoke/
            .artifacts/tauri-e2e/
          if-no-files-found: warn

