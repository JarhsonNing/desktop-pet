name: Native builds and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- --simulate
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Prepare CI-only Windows software renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa archive checksum mismatch' }
          7z x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $binaryDirectory = 'target/${{ matrix.target }}/release'
          Get-ChildItem "$destination/x64" -Filter '*.dll' -File | Copy-Item -Destination $binaryDirectory
          if (!(Test-Path "$binaryDirectory/opengl32.dll")) { throw 'Mesa OpenGL driver missing' }
          'GALLIUM_DRIVER=llvmpipe' >> $env:GITHUB_ENV
      - name: Native GUI smoke test
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/desktop-pet
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="$binary.exe"; fi
          python scripts/ci_smoke.py --binary "$binary" --output .artifacts/smoke
      - run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GUI-smoke-${{ matrix.target }}
          path: .artifacts/smoke/
          if-no-files-found: warn

