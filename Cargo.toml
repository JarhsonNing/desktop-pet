[package]
name = "desktop-pet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Mochi: a small, mischievous native desktop companion"
license = "MIT"
repository = "https://github.com/JarhsonNing/desktop-pet"
default-run = "desktop-pet"

[workspace]
members = ["panel/src-tauri"]
default-members = ["."]
resolver = "3"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
directories = "6"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
sha2 = "0.10"
rusqlite = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
raw-window-handle = "0.6"
rfd = "0.15"
base64 = "0.22"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21"
global-hotkey = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSFilePromiseReceiver", "NSFilePromiseProvider"] }
objc2-foundation = "0.3"
block2 = "0.6"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

