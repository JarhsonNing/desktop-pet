[package]
name = "desktop-pet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Mochi: a small, mischievous native desktop companion"
license = "MIT"
repository = "https://github.com/JarhsonNing/desktop-pet"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21"
global-hotkey = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

